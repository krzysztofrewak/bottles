<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <title>A Multi-Attribute Dataset of Commercial Bottles for Computer Vision Research</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  </head>

  <body class="bg-gray-100 text-gray-900 p-8">
    <div x-data="datasetExplorer()" x-init="loadData()" class="max-w-5xl mx-auto">
      <h1 class="text-2xl font-bold">A Multi-Attribute Dataset of Commercial Bottles for Computer Vision Research</h1>
      <h2 class="text-xl mb-6">A statistics tool</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
        <template x-for="attr in attributes" :key="attr">
          <div>
            <label class="block text-sm font-semibold mb-1" x-text="attr"></label>
            <select class="w-full border rounded p-2" x-model="filters[attr]">
              <option value="">(no filter)</option>
              <template x-for="option in uniqueValues[attr]" :key="option">
                <option x-text="option"></option>
              </template>
            </select>
          </div>
        </template>
      </div>

      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">Statistics <span class="text-gray-400 font-normal text-lg" x-text="'(' + filteredData.reduce((s, r) => s + r.count, 0) + ')'"></span></h2>
        <button @click="chartMode = !chartMode" class="flex items-center gap-1.5 text-sm text-gray-400 hover:text-gray-600">
          <span x-show="!chartMode">Switch to chart</span>
          <span x-show="chartMode">Switch to table</span>
          <svg x-show="!chartMode" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="11" width="5" height="11" rx="1"/><rect x="9.5" y="6" width="5" height="16" rx="1"/><rect x="17" y="2" width="5" height="20" rx="1"/>
          </svg>
          <svg x-show="chartMode" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/>
          </svg>
        </button>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <template x-for="attr in attributes" :key="attr">
          <div class="bg-white p-4 rounded shadow">
            <h3 class="font-semibold mb-2" x-text="attr"></h3>
            <template x-for="[key, value] in sortedStats(attr)" :key="key">
              <div class="flex justify-between items-center border-b py-1 cursor-pointer rounded px-1 -mx-1"
                   :class="filters[attr] === key ? 'bg-blue-100 hover:bg-blue-200' : 'hover:bg-blue-50'"
                   @click="setFilter(attr, key)">
                <span x-text="key"></span>
                <span class="font-bold" :class="chartMode ? 'hidden' : ''" x-text="value"></span>
                <div class="flex items-center gap-2 w-32" :class="chartMode ? '' : 'hidden'">
                  <div class="flex-1 bg-gray-100 rounded h-2.5">
                    <div class="bg-blue-400 h-2.5 rounded" :style="'width:' + Math.round(value / attrTotal(attr) * 100) + '%'"></div>
                  </div>
                  <span class="text-xs text-gray-500 w-8 text-right" x-text="Math.round(value / attrTotal(attr) * 100) + '%'"></span>
                </div>
              </div>
            </template>
            <div class="text-gray-400 flex justify-between py-1">
              <span>total</span> <span x-text="Object.values(stats()[attr]).reduce((a,b)=>a+b,0)"></span>
            </div>
          </div>
        </template>
      </div>

      <h2 class="text-2xl font-bold mt-8 mb-4">Combinations <span class="text-gray-400 font-normal text-lg" x-text="'(' + sortedCombinations().length + ')'"></span></h2>
      <div class="p-4 bg-white rounded shadow overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-left">
            <tr>
              <th class="px-4 py-2 w-0 font-semibold text-gray-400">#</th>
              <template x-for="attr in attributes" :key="attr">
                <th class="px-4 py-2 font-semibold" x-text="attr"></th>
              </template>
              <th class="px-4 py-2 font-semibold text-right">count</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(row, i) in sortedCombinations()" :key="i">
              <tr class="border-t">
                <td class="px-4 py-1 text-gray-400" x-text="i + 1"></td>
                <template x-for="attr in attributes" :key="attr">
                  <td class="px-4 py-1 cursor-pointer"
                      :class="filters[attr] === row[attr] ? 'bg-blue-100 hover:bg-blue-200' : 'hover:bg-blue-50'"
                      @click="setFilter(attr, row[attr])"
                      x-text="row[attr]"></td>
                </template>
                <td class="px-4 py-1 font-bold text-right" x-text="row.count"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <footer class="my-8 py-8 text-sm text-gray-600">
        <div class="max-w-5xl mx-auto px-4">
          <div class="flex flex-col md:flex-row md:justify-between gap-6">
            <div>
              <div class="font-semibold mb-2 text-gray-700">GitHub repository</div>
              <a href="https://github.com/krzysztofrewak/bottles" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 .5C5.73.5.5 5.74.5 12.02c0 5.1 3.29 9.43 7.86 10.96.58.11.79-.25.79-.56v-2.1c-3.2.7-3.87-1.55-3.87-1.55-.53-1.35-1.3-1.71-1.3-1.71-1.06-.73.08-.72.08-.72 1.17.08 1.78 1.21 1.78 1.21 1.04 1.8 2.73 1.28 3.4.98.1-.77.41-1.28.75-1.58-2.55-.29-5.23-1.3-5.23-5.79 0-1.28.45-2.33 1.2-3.15-.12-.3-.52-1.52.11-3.16 0 0 .97-.31 3.18 1.2a11.1 11.1 0 0 1 5.8 0c2.2-1.5 3.17-1.2 3.17-1.2.63 1.64.23 2.86.11 3.16.75.82 1.19 1.87 1.19 3.15 0 4.51-2.69 5.49-5.25 5.78.42.37.81 1.1.81 2.22v3.29c0 .32.21.69.8.57A10.99 10.99 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/>
                </svg>
                github.com/krzysztofrewak/bottles
              </a>
            </div>

            <div>
              <div class="font-semibold mb-2 text-gray-700">Authors</div>
              <ul class="flex flex-wrap gap-x-6">
                <li>
                  <a href="https://orcid.org/0000-0001-9109-3350" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline flex items-center gap-2">
                    <img src="https://orcid.org/sites/default/files/images/orcid_16x16.png" class="w-4 h-4" alt="Mateusz Jackowski"> Mateusz Jackowski
                  </a>
                </li>
                <li>
                  <a href="https://orcid.org/0009-0003-6847-8318" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline flex items-center gap-2">
                    <img src="https://orcid.org/sites/default/files/images/orcid_16x16.png" class="w-4 h-4" alt="Krzysztof Rewak"> Krzysztof Rewak
                  </a>
                </li>
                <li>
                  <a href="https://orcid.org/0009-0004-6384-825X" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline flex items-center gap-2">
                    <img src="https://orcid.org/sites/default/files/images/orcid_16x16.png" class="w-4 h-4" alt="Karol Zygadło"> Karol Zygadło
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <script>
      function datasetExplorer() {
        return {
          allData: [],
          attributes: ["type", "color", "fill", "liquid", "label", "cap"],
          filters: {type: "", color: "", fill: "", liquid: "", label: "", cap: ""},
          chartMode: false,
          uniqueValues: {},
          async loadData() {
            const res = await fetch("data.json")
            this.allData = await res.json()

            this.attributes.forEach(attr => {
              this.uniqueValues[attr] = [...new Set(this.allData.map(x => x[attr]))]
            })
          },
          get filteredData() {
            return this.allData.filter(item => {
              return Object.entries(this.filters).every(([k, v]) => {
                return !v || item[k] === v
              })
            })
          },
          stats() {
            const out = {}

            this.attributes.forEach(attr => {
              out[attr] = {}
              this.filteredData.forEach(item => {
                out[attr][item[attr]] = (out[attr][item[attr]] || 0) + item.count
              })
            })

            return out
          },
          sortedStats(attr) {
            return Object.entries(this.stats()[attr]).sort((a, b) => b[1] - a[1])
          },
          sortedCombinations() {
            return [...this.filteredData].sort((a, b) => b.count - a.count)
          },
          setFilter(attr, val) {
            this.filters[attr] = this.filters[attr] === val ? "" : val
          },
          attrTotal(attr) {
            return Object.values(this.stats()[attr]).reduce((a, b) => a + b, 0)
          },
        };
      }
    </script>
  </body>
</html>
